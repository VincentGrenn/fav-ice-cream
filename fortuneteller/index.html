<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://glitch.com/favicon.ico" />
   

    <title>Fortune Teller</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- this is the start of content -->
     <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyDL8_hQOwzmhVa9NJjCMgN7LG047EG9EHrUlIZU0Ao-AInkdjXvLzeezN&s=10"width="150px"height="150px"></img>
     <br>
    <h1>
      Fortune Teller
    </h1>
    <form name="fortuneTeller" id="fortuneTeller" action="fortune.html">
      <label for="namefield">Name:</label>
      <input type="text" id="namefield" name="name" placeholder="your name" required>
      <br>
      <label for="questionfield">Question:</label>
      <input type="text" id="questionfield" name="question" placeholder="a yes or no question">
      <br>
      <label>Addtl. Information</label>
      <textarea id="addtlinfo"placeholder="any other info"></textarea>
      <br>
      <label>Add Bias</label>
      <input type="radio" id="biasradio" name="bias" value="bias">
      <br>
      <label>Use Very Special Magic</label>
      <input type="checkbox" id="usemagic" name="magicgatherer" value="magic">
      <br>
      <label>Degree of Magic</label>
      <select>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
      <br>
      <input type="reset">
      <br>
      <input type="submit">
    </form>
    <div id="fortune"></div>
  </body>
</html>
